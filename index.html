<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Tabs</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .tabs {
            border-bottom: 2px solid #ccc;
        }

        .tab-button {
            border: none;
            background: none;
            padding: 10px 16px;
            cursor: pointer;
            font-size: 16px;
        }

        .tab-button.active {
            border-bottom: 3px solid #007BFF;
            font-weight: bold;
        }

        .tab-panel {
            display: none;
            padding-top: 16px;
        }

        .tab-panel.active {
            display: block;
        }

        canvas {
            border: 1px solid grey;
            background-color: white;
        }
    </style>
    <script src="biography.js" defer></script>
    <script src="emoji.js" defer></script>
    <script src="gif.js" defer></script>
</head>

<body>
    <nav class="tabs" aria-label="Page tabs">
        <button class="tab-button active" data-tab="biography" type="button">Biography</button>
        <button class="tab-button" data-tab="emoji" type="button">Emoji</button>
        <button class="tab-button" data-tab="gif" type="button">GIF Form</button>
    </nav>

    <section id="biography" class="tab-panel active" role="tabpanel"></section>

    <section id="emoji" class="tab-panel" role="tabpanel">
        <canvas id="emojiCanvas" width="300" height="300"></canvas>
    </section>

    <section id="gif" class="tab-panel" role="tabpanel">
        <form>
            <img id="myImage" src="/images/html.gif" alt="HTML moving GIF" />
            <p>Click a button or use the arrow keys to move the image.</p>
            <input type="button" value="right" onclick="moveRight();" />
            <input type="button" value="left" onclick="moveLeft();" />
            <input type="button" value="up" onclick="moveUp();" />
            <input type="button" value="down" onclick="moveDown();" />
        </form>
    </section>

    <script>
        document.querySelectorAll('.tab-button').forEach(function (button) {
            button.addEventListener('click', function () {
                document.querySelectorAll('.tab-button').forEach(function (tabButton) {
                    tabButton.classList.remove('active');
                });
                document.querySelectorAll('.tab-panel').forEach(function (panel) {
                    panel.classList.remove('active');
                });

                button.classList.add('active');
                document.getElementById(button.dataset.tab).classList.add('active');
            });
        });
    </script>
</body>
</html>
